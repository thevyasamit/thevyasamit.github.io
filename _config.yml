# ---------------------------------------------------------------------------
# Site
# ---------------------------------------------------------------------------
title: Amit Vyas
tagline: AI and Research Software Engineer
description: >-
  I'm Amit Vyas, an AI and Research Software Engineer building software and
  infrastructure for scientific computing and AI research. At the ICICLE AI
  Institute at The Ohio State University, I work with researchers, scientists,
  and domain experts across multiple institutions to turn research ideas into
  reliable, reusable systems: AI infrastructure, research platforms, and
  open-source tools spanning ML infrastructure, retrieval, agentic AI, model
  serving, and scientific software.
url: "https://thevyasamit.github.io"
baseurl: ""
lang: en_US
# UTC so the footer year rolls over exactly at 00:00 UTC on 1 Jan,
# which is what .github/workflows/refresh-year.yml schedules against.
timezone: Etc/UTC

author:
  name: Amit Vyas
  twitter: thevyasamit
  role: AI and Research Software Engineer
  org: ICICLE AI Institute, The Ohio State University
  location: Columbus, OH, United States

# Used by jekyll-seo-tag for social cards.
image: /images/av.jpg
twitter:
  username: thevyasamit
  card: summary_large_image
social:
  name: Amit Vyas
  links:
    - https://github.com/thevyasamit
    - https://www.linkedin.com/in/thevyasamit/
    - https://twitter.com/thevyasamit
    - https://scholar.google.com/citations?user=6D2uXYEAAAAJ&hl=en

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true          # heading anchors -> deep-linkable, better for AI + humans

permalink: /writing/:slug/
future: false

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: /feed.xml

# ---------------------------------------------------------------------------
# Analytics
# ---------------------------------------------------------------------------
# Cloudflare Web Analytics. This token is a PUBLIC site identifier -- it ships
# in the HTML of every page, so it is committed deliberately, not leaked.
# It is write-only and hostname-bound: Cloudflare rejects beacons whose
# hostname does not postfix-match the one registered in the dashboard, and the
# token cannot be used to READ any data.
#
# NOTE: if the site ever moves to a custom domain, add that hostname in the
# Cloudflare dashboard too, or analytics will silently drop to zero.
# Leave blank to disable.
analytics:
  cloudflare_token: "1de6b7b8165a4442afa34edb453e5f88"

defaults:
  - scope: { path: "" }
    values:
      image: /images/og-card.png   # jekyll-seo-tag reads page.image only
  - scope: { path: "", type: posts }
    values:
      layout: post
      sitemap: true
  - scope: { path: "" }
    values:
      layout: page

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .github
  - scripts
  - "*.gem"
