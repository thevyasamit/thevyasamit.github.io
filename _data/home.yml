# Everything on the homepage (and the sidebar tagline) that is prose rather
# than structure. Inline HTML is allowed (links, <em>, &mdash; and friends).

# Sidebar line under the name. `struck` renders crossed out between the two.
tagline:
  before: I&rsquo;m a human trying to understand AI before
  struck: AI starts understanding humans
  after: ", AI starts taking over the humans!"

intro:
  lede: >-
    I'm a software engineer and researcher. I build the plumbing that makes AI
    research usable &mdash; APIs, infrastructure and developer tooling &mdash;
    at the <a href="https://icicle.osu.edu/">ICICLE AI Institute</a>,
    The Ohio State University.

# The cards on the homepage, in order. `links` are either a `social` key
# (matched against `icon` in _data/social.yml, so each URL lives in one place)
# or a `url` + `label` pair.
doors:
  - kicker: Papers
    title: Publications
    icon: scholar
    text: >-
      I try to keep my Google Scholar profile up to date, and it does a much
      better job of listing my papers than I would here.
    links:
      - social: scholar
        label: Open Google Scholar

  - kicker: Code
    title: Things I build
    icon: github
    text: >-
      Want to see the actual code? My GitHub has my projects, a lot of them
      AI-powered.
    links:
      - social: github
        label: Visit my GitHub

  - kicker: CV
    title: My course of life
    icon: cv
    text: >-
      Curious where I've been and what I've done so far? It's all in my CV,
      and I'll try to keep it updated.
    links:
      - url: /assets/Amit_Vyas_CV.pdf
        label: Open my CV (PDF)

  - kicker: Networking
    title: Let's connect
    icon: wave
    text: >-
      Always happy to meet people working on interesting things. Say hi on
      LinkedIn or X.
    links:
      - social: linkedin
        label: LinkedIn
      - social: x
        label: X
