name: Build & deploy

on:
  push:
    branches: [master, main]      # both, so renaming the default branch cannot silently stop deploys
  pull_request:
    branches: [master, main]      # build + link-check only; the deploy job is skipped
  workflow_dispatch:
  workflow_call:                  # invoked by refresh-year.yml

permissions:
  contents: read
  pages: write
  id-token: write

# Keyed by ref so a pull-request build never queues behind a live deploy.
# Real deploys still serialise against each other on the branch ref.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Check for broken links and bad HTML
        run: |
          gem install html-proofer -v '~> 5.0' --no-document
          htmlproofer ./_site \
            --disable-external \
            --allow-hash-href \
            --no-enforce-https

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'

  deploy:
    needs: build
    # Pull requests get validated, never published.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
